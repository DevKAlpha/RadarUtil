<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title">
<title>Estudiante explorando oportunidades</title>
<defs>
  <linearGradient id="blob" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#edf7ff"/>
    <stop offset="1" stop-color="#e8faf7"/>
  </linearGradient>
  <linearGradient id="hoodie" x1="0" x2="1">
    <stop offset="0" stop-color="#15b4aa"/>
    <stop offset="1" stop-color="#3acbb9"/>
  </linearGradient>
  <linearGradient id="book" x1="0" x2="1">
    <stop offset="0" stop-color="#2f80ed"/>
    <stop offset="1" stop-color="#4d96ee"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4f7aa7" flood-opacity=".12"/>
  </filter>
</defs>

<!-- fondo orgánico -->
<path d="M74 284C37 219 65 111 164 66c86-39 171-3 248-12 99-12 182 27 211 101 33 85-8 173-95 214-84 40-213 40-322 13C141 366 103 335 74 284Z" fill="url(#blob)"/>

<!-- estudiante -->
<g transform="translate(185 22)">
  <ellipse cx="222" cy="360" rx="126" ry="24" fill="#cfe4f5" opacity=".55"/>

  <!-- mochila -->
  <path d="M135 175c-36 23-57 81-45 153h43c-5-55 5-100 34-128z" fill="#0b467f"/>
  <path d="M117 198c-20 15-29 42-30 79" fill="none" stroke="#0a3f74" stroke-width="11" stroke-linecap="round"/>

  <!-- cabello largo detrás -->
  <path d="M187 57c-58 2-92 44-86 100 3 31 16 54 11 84-5 27-19 49-6 78 18 39 78 46 126 28 38-14 65-48 67-91 2-35-11-57-8-89 7-69-38-112-104-110Z" fill="#082b67"/>
  <path d="M134 102c-25 43-23 100-1 139 11 20 22 41 20 74" fill="none" stroke="#0b376c" stroke-width="22" stroke-linecap="round"/>

  <!-- cuello -->
  <rect x="193" y="143" width="43" height="42" rx="20" fill="#f6b894"/>

  <!-- rostro -->
  <ellipse cx="211" cy="113" rx="55" ry="63" fill="#ffd2b5"/>
  <!-- flequillo/cabello frontal -->
  <path d="M159 100c4-49 33-74 77-68 39 5 61 38 55 78-18-25-44-35-78-30-22 3-39 10-54 20Z" fill="#082b67"/>
  <path d="M158 112c-12-29 0-63 25-79 17-11 38-14 60-8-32 10-59 36-62 78Z" fill="#082b67"/>

  <!-- oreja -->
  <ellipse cx="157" cy="119" rx="10" ry="15" fill="#ffc8aa"/>

  <!-- ojos -->
  <circle cx="193" cy="115" r="4.2" fill="#082b67"/>
  <circle cx="229" cy="115" r="4.2" fill="#082b67"/>
  <path d="M199 137c11 9 25 9 36-1" fill="none" stroke="#d76e61" stroke-width="4" stroke-linecap="round"/>

  <!-- hoodie -->
  <path d="M134 322c7-95 22-145 73-157 53-12 100 31 115 157Z" fill="url(#hoodie)"/>
  <path d="M188 174c7 23 20 34 32 34 15 0 27-12 35-34" fill="none" stroke="#c9f5ed" stroke-width="5" stroke-linecap="round"/>
  <path d="M203 178l-8 42M242 178l10 42" stroke="#d8faf3" stroke-width="4" stroke-linecap="round"/>

  <!-- mangas -->
  <path d="M157 215c-33 17-49 52-55 93 14 11 28 16 43 12 11-38 22-61 40-78Z" fill="#1fb6aa"/>
  <path d="M281 207c31 15 49 49 54 93-14 12-28 17-43 13-12-38-24-62-42-79Z" fill="#20b6aa"/>

  <!-- brazos -->
  <path d="M119 291c14 7 31 8 50 1 17-7 31-18 43-33" fill="none" stroke="#ffd2b5" stroke-width="20" stroke-linecap="round"/>
  <path d="M317 292c-13 8-29 10-48 4-17-5-34-16-47-30" fill="none" stroke="#ffd2b5" stroke-width="20" stroke-linecap="round"/>

  <!-- cuaderno -->
  <g transform="rotate(-8 223 260)" filter="url(#shadow)">
    <rect x="185" y="208" width="82" height="112" rx="8" fill="url(#book)"/>
    <rect x="198" y="221" width="55" height="79" rx="5" fill="#e8f4ff"/>
    <rect x="201" y="224" width="49" height="7" rx="3" fill="#c5ddfa"/>
  </g>
</g>

<!-- chips a la derecha, como en el mockup -->
<g font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#082b67" filter="url(#shadow)">
  <g transform="translate(525 86)">
    <rect width="126" height="54" rx="16" fill="#fff" stroke="#dbe8f5"/>
    <g transform="translate(18 15)">
      <path d="M0 8 14 0l14 8-14 8z" fill="#0874e8"/><path d="M5 12v8c6 4 12 4 18 0v-8" fill="none" stroke="#0874e8" stroke-width="2.5"/>
    </g>
    <text x="58" y="34">Becas</text>
  </g>
  <g transform="translate(525 153)">
    <rect width="126" height="54" rx="16" fill="#fff" stroke="#dbe8f5"/>
    <rect x="19" y="17" width="29" height="21" rx="3" fill="#0874e8"/><rect x="25" y="12" width="17" height="7" rx="3" fill="none" stroke="#0874e8" stroke-width="3"/>
    <text x="58" y="34">Empleos</text>
  </g>
  <g transform="translate(525 220)">
    <rect width="126" height="54" rx="16" fill="#fff" stroke="#dbe8f5"/>
    <rect x="20" y="15" width="29" height="20" rx="2" fill="#7657e8"/><rect x="24" y="18" width="21" height="14" rx="1" fill="#efeaff"/><path d="M18 38h33" stroke="#7657e8" stroke-width="3" stroke-linecap="round"/>
    <text x="58" y="34">Cursos</text>
  </g>
  <g transform="translate(525 287)">
    <rect width="126" height="54" rx="16" fill="#fff" stroke="#dbe8f5"/>
    <rect x="20" y="16" width="29" height="25" rx="4" fill="#ef713a"/><path d="M25 12v8M43 12v8" stroke="#ef713a" stroke-width="3" stroke-linecap="round"/><path d="M25 26h19" stroke="#fff" stroke-width="2.5"/>
    <text x="58" y="34">Eventos</text>
  </g>
</g>

<!-- mensaje manuscrito -->
<g transform="translate(469 306) rotate(-7)" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#1677d2">
  <text x="0" y="0">Tu futuro</text>
  <text x="0" y="23">también</text>
  <text x="0" y="46">está aquí</text>
  <path d="M-15 -6l-17 -16M-20 54l-17 17" stroke="#11aaa0" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>