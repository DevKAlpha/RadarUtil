name: Publica Radar Útil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtiene el proyecto
        uses: actions/checkout@v6
      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instala dependencias
        run: npm ci
      - name: Compila Angular para Pages
        run: npm run build:pages
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara el sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/radar-util/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica el sitio
        id: deployment
        uses: actions/deploy-pages@v4
